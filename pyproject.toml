[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-semantic-chatbi"
version = "4.9.0"
description = "Governed industrial semantic analytics, federation and reasoning engine"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
governance = ["sqlglot>=25"]
postgres = ["psycopg[binary]>=3.2"]
auth = ["PyJWT[crypto]>=2.9"]
secrets = ["hvac>=2.3", "azure-identity>=1.19", "azure-keyvault-secrets>=4.9"]
qdrant = ["qdrant-client>=1.12"]
pgvector = ["psycopg[binary]>=3.2", "pgvector>=0.3"]
