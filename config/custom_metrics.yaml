metrics:
  energy_consumption:
    description: 设备总能耗
    expression: SUM(energy_kwh)
    unit: kWh
    synonyms:
    - 能耗
    - 耗电
    - 电量
  production_output:
    description: 总产量
    expression: SUM(output_qty)
    unit: 件
    synonyms:
    - 产量
    - 产出
  specific_energy:
    description: 单位产量能耗
    expression: SUM(energy_kwh)/NULLIF(SUM(output_qty),0)
    unit: kWh/件
    synonyms:
    - 单耗
    - 单位能耗
  oee:
    description: 设备综合效率
    expression: availability * performance * quality
    unit: '%'
    synonyms:
    - OEE
    - 设备效率
  alarm_count:
    description: 告警次数
    expression: COUNT(*)
    unit: 次
    synonyms:
    - 报警次数
    - 告警数
