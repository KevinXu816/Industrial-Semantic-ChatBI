services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: industrial_semantic
      POSTGRES_USER: industrial_semantic
      POSTGRES_PASSWORD: industrial_semantic
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U industrial_semantic -d industrial_semantic"]
      interval: 5s
      timeout: 3s
      retries: 20
  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["qdrant"]
    ports: ["6333:6333"]
    volumes:
      - qdrantdata:/qdrant/storage

  app:
    build:
      context: .
      args:
        INSTALL_EXTRAS: ${INSTALL_EXTRAS:-postgres,governance,auth}
    ports: ["8000:8000"]
    environment:
      PERSISTENCE_BACKEND: postgres
      DATABASE_URL: postgresql://industrial_semantic:industrial_semantic@postgres:5432/industrial_semantic
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-default}
      ALLOW_PRIVATE_API_PULL: ${ALLOW_PRIVATE_API_PULL:-false}
      ALLOW_INSECURE_API_HTTP: ${ALLOW_INSECURE_API_HTTP:-false}
      AUTH_MODE: ${AUTH_MODE:-disabled}
      AUTH_AUTO_PROVISION: ${AUTH_AUTO_PROVISION:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      AUTH_JWT_SECRET_REF: ${AUTH_JWT_SECRET_REF:-}
      SECRETS_DEFAULT_PROVIDER: ${SECRETS_DEFAULT_PROVIDER:-env}
      SECRETS_FILE_ROOT: /run/secrets
      EXECUTION_MODE: ${EXECUTION_MODE:-mock}
      DORIS_HOST: ${DORIS_HOST:-}
      DORIS_PORT: ${DORIS_PORT:-9030}
      DORIS_USER: ${DORIS_USER:-root}
      DORIS_DATABASE: ${DORIS_DATABASE:-industrial_ai}
      DORIS_PASSWORD_REF: ${DORIS_PASSWORD_REF:-}
      DORIS_PASSWORD: ${DORIS_PASSWORD:-}
      KNOWLEDGE_BACKEND: ${KNOWLEDGE_BACKEND:-local}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-industrial_knowledge}
      QDRANT_API_KEY_REF: ${QDRANT_API_KEY_REF:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-development}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  pgdata:
  qdrantdata:
